version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/**"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: scope
    ignore:
      - dependency-name: "epam/ai-dial-ci"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    groups:
      github-actions:
        group-by: "dependency-name"
        patterns:
          - "*"
  # PyYAML of the SCA actions (pinned with hashes); the three requirements files are identical, see test/sca
  - package-ecosystem: "pip"
    directories:
      - "/actions/sca_resolve_targets"
      - "/actions/sca_prepare_trivy_config"
      - "/actions/sca_build_cve_index"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: scope
    cooldown:
      default-days: 7
    groups:
      sca-actions-python:
        patterns:
          - "*"

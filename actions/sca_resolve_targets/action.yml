name: Resolve SCA scan targets
description: Resolve the default-branch snapshot, the source of the latest release and the container images (development and latest release) that an SCA scheduled scan should cover

inputs:
  repository:
    description: Repository (owner/name) whose code is scanned and whose releases are resolved
    required: true
  registry:
    description: Container registry the images are pulled from
    default: ghcr.io
  images:
    description: Image names without registry, one per line (e.g. epam/ai-dial-chat). Empty means source scan only
    default: ""
  github-token:
    description: Token for the GitHub API and for authenticating to ghcr.io
    default: ${{ github.token }}
  output-dir:
    description: Directory where targets.json is written
    default: ${{ runner.temp }}/sca

outputs:
  matrix:
    description: Compact JSON array of the pending Trivy targets (may be "[]")
    value: ${{ steps.targets.outputs.matrix }}
  targets-file:
    description: Path to targets.json with all targets and their statuses
    value: ${{ steps.targets.outputs.targets-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    # gh (GitHub API) is on the runner image; oras lists the tags of the images
    - name: Set up ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: "1.3.3"
    - name: Resolve targets
      id: targets
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        REGISTRY: ${{ inputs.registry }}
        IMAGES: ${{ inputs.images }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
        # the shared code of the SCA actions: actions/_sca_lib, a sibling of this directory
        PYTHONPATH: ${{ github.action_path }}/..
      run: python "$ACTION_PATH/resolve_targets.py"

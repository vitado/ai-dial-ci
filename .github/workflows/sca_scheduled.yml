name: SCA scheduled scan

on:
  workflow_call:
    inputs:
      images:
        type: string
        description: Image names without registry, one per line (e.g. epam/ai-dial-chat). Empty means source scan only
        default: ""
      registry:
        type: string
        description: Container registry the images are pulled from
        default: "ghcr.io"
      repository:
        type: string
        description: Repository (owner/name) whose code is scanned and whose releases are resolved. Defaults to the calling repository
        default: ""
      release-lines:
        type: number
        description: Number of latest stable release lines to scan
        default: 1
      java-version:
        type: string
        description: Java version to use to generate lockfiles (Gradle repositories only)
        default: "21"
      java-distribution:
        type: string
        description: Java distribution to use
        default: "temurin"
      trivy-version:
        type: string
        description: Trivy version to use (release tag, e.g. v0.75.0)
        default: "v0.75.0"
      trivy-db-repository:
        type: string
        description: Trivy vulnerability DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
      trivy-java-db-repository:
        type: string
        description: Trivy Java DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"
      ort-enabled:
        type: boolean
        description: Also scan the source code with ORT (analyzer and advisor with OSV). Its findings are counted in the report but not merged into the findings yet
        default: false
      ort-version:
        type: string
        description: ORT version to use
        default: "94.2.0"
      ort-config-repository:
        type: string
        description: ORT config repository to use
        default: ${{ vars.ORT_CONFIG_VCS_URL || 'https://github.com/epam/ai-dial-ort-config.git' }}
      ort-config-revision:
        type: string
        description: ORT config revision to use
        default: ${{ vars.ORT_CONFIG_VCS_REVISION || '92.5.0' }}
      retention-days:
        type: number
        description: Retention period (days) of the resulting `sca-report` artifact
        default: 90
      scan-source:
        type: boolean
        description: Scan the source code (default branch)
        default: true
      scan-images:
        type: boolean
        description: Scan the container images
        default: true
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-24.04"]'

jobs:
  targets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      ort-matrix: ${{ steps.targets.outputs.ort-matrix }}
    steps:
      - uses: vitado/ai-dial-ci/actions/sca_resolve_targets@pilot/sca-ort-probe
        id: targets
        with:
          repository: ${{ inputs.repository || github.repository }}
          registry: ${{ inputs.registry }}
          images: ${{ inputs.images }}
          release-lines: ${{ inputs.release-lines }}
          scan-source: ${{ inputs.scan-source }}
          scan-images: ${{ inputs.scan-images }}
          ort-enabled: ${{ inputs.ort-enabled }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-part-targets
          path: ${{ steps.targets.outputs.targets-file }}
          retention-days: 1
          if-no-files-found: error

  # One Trivy DB snapshot per run: all targets scan against the same DB versions, and the matrix jobs neither
  # download the DB each nor race to save the same cache keys (this job is the single cache writer)
  trivy-db:
    if: ${{ inputs.scan-source || inputs.scan-images }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
      db-info: ${{ steps.info.outputs.db-info }}
    steps:
      # First, so that the key is published even if a later step fails
      - name: Define DB cache key
        id: key
        run: echo "cache-key=trivy-db-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ inputs.trivy-version }}
          cache: true # the binary is cached under a version key; this is the only job that saves it
      - name: Download Trivy databases
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DB_REPOSITORY: ${{ inputs.trivy-db-repository }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ inputs.trivy-java-db-repository }}
        run: |
          trivy image --download-db-only
          trivy image --download-java-db-only
      - name: Describe Trivy databases
        id: info
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy version --format json > "$RUNNER_TEMP/trivy-version.json"
          jq . "$RUNNER_TEMP/trivy-version.json"
          db_info="$(jq -c '{vulnerability_db_updated_at: .VulnerabilityDB.UpdatedAt, java_db_updated_at: .JavaDB.UpdatedAt}' "$RUNNER_TEMP/trivy-version.json")"
          echo "db-info=$db_info" >> "$GITHUB_OUTPUT"
          echo "Trivy DB snapshot: $db_info" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.key.outputs.cache-key }}

  trivy:
    needs: [targets, trivy-db]
    # Runs even if trivy-db failed: the DB restore then fails and every target is reported as failed with a reason
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.targets.outputs.matrix != '[]' }}
    name: Trivy ${{ matrix.target.id }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      # Scan profile: exposure of the repository, not a gate, so nothing is ignored or filtered out.
      # It is set via env rather than trivy-action inputs: the action exports an input to TRIVY_* only when it
      # differs from the action's own default, so `ignore-unfixed: false` or the full severity list would not be
      # exported and a repository's trivy.yaml would win. Environment variables take precedence over trivy.yaml.
      # TRIVY_IGNOREFILE is /dev/null, not empty, because trivy treats an empty value as unset and reads .trivyignore
      TRIVY_IGNOREFILE: /dev/null
      TRIVY_IGNORE_UNFIXED: "false"
      TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      TRIVY_PKG_TYPES: os,library
      TRIVY_SCANNERS: vuln
      TRIVY_LIST_ALL_PKGS: "true" # trivy default for JSON, pinned so a repository trivy.yaml cannot disable the inventory behind packages_scanned
      TRIVY_INCLUDE_DEV_DEPS: "true" # trivy skips dev dependencies by default; trivy-action has no input for it
      TRIVY_EXIT_CODE: "0" # findings are the payload, not a failure
      TRIVY_DISABLE_VEX_NOTICE: "true"
      # All targets of the run use the snapshot restored from the trivy-db job
      TRIVY_SKIP_DB_UPDATE: "true"
      TRIVY_SKIP_JAVA_DB_UPDATE: "true"
      TARGET_ID: ${{ matrix.target.id }}
    steps:
      - name: Prepare output directory
        run: mkdir -p "$RUNNER_TEMP/sca-out/trivy"
      # The DB snapshot of the trivy-db job; a miss fails the target instead of silently downloading another DB
      - name: Restore Trivy databases
        id: db
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ needs.trivy-db.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        id: setup
        with:
          version: ${{ inputs.trivy-version }}
          cache: true # hits the binary cache saved by trivy-db, so there is no save race between the matrix jobs
      - name: Checkout
        id: checkout
        if: ${{ matrix.target.kind == 'fs' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # The commit the targets job resolved for this target, not a moving branch
          ref: ${{ matrix.target.commit_sha }}
          persist-credentials: false
          lfs: true
      - name: Detect Gradle build
        id: stack
        if: ${{ matrix.target.kind == 'fs' }}
        run: |
          if [ -f gradlew ] && { [ -f build.gradle ] || [ -f build.gradle.kts ]; }; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Java
        id: java
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: epam/ai-dial-ci/actions/java_prepare@4.12.0
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
      - name: Generate Gradle lockfiles
        id: lockfiles
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: vitado/ai-dial-ci/actions/generate_gradle_lockfiles@pilot/sca-ort-probe
        with:
          gpr-username: ${{ github.actor }}
          gpr-password: ${{ secrets.GITHUB_TOKEN }}
      # Images in other registries are expected to be public and are pulled anonymously
      - name: Login to GitHub Container Registry
        id: login
        if: ${{ matrix.target.kind == 'image' && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ matrix.target.kind }}
          scan-ref: .
          image-ref: ${{ matrix.target.ref }}
          format: json
          output: ${{ runner.temp }}/sca-out/trivy/${{ matrix.target.id }}.json
          # Outside the workspace, so that the cache is not scanned
          cache-dir: ${{ runner.temp }}/trivy-cache
          # Trivy and the DB are set up above; trivy-action must not set up or cache anything itself
          skip-setup-trivy: true
          cache: false
      - name: Generate Trivy report (Table)
        if: ${{ steps.trivy.outcome == 'success' }}
        run: |
          trivy convert --format table --output "$RUNNER_TEMP/sca-out/trivy/$TARGET_ID.txt" "$RUNNER_TEMP/sca-out/trivy/$TARGET_ID.json"
      # The status is written even if the scan failed: a failed target must not look like a clean one
      - name: Write scan status
        if: ${{ always() }}
        env:
          DB_OUTCOME: ${{ steps.db.outcome }}
          DB_JOB_RESULT: ${{ needs.trivy-db.result }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          LOCKFILES_OUTCOME: ${{ steps.lockfiles.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          LOCKFILES: ${{ steps.lockfiles.outputs.lockfiles }}
        run: |
          out="$RUNNER_TEMP/sca-out/trivy"
          status=ok
          reason=
          for step in "trivy db restore:$DB_OUTCOME" "trivy setup:$SETUP_OUTCOME" "checkout:$CHECKOUT_OUTCOME" "java setup:$JAVA_OUTCOME" "lockfile generation:$LOCKFILES_OUTCOME" "registry login:$LOGIN_OUTCOME" "trivy scan:$TRIVY_OUTCOME"; do
            outcome="${step#*:}"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              status=failed
              reason="${step%%:*} $outcome"
              if [ "${step%%:*}" = "trivy db restore" ]; then
                reason="$reason (trivy-db job: $DB_JOB_RESULT)"
              fi
              break
            fi
          done
          if [ "$status" = "ok" ] && [ "$TRIVY_OUTCOME" != "success" ]; then
            status=failed
            reason="scan did not complete"
          fi
          if [ "$status" = "ok" ] && ! jq -e . "$out/$TARGET_ID.json" > /dev/null 2>&1; then
            status=failed
            reason="trivy output is missing or is not valid JSON"
          fi
          jq -n --arg id "$TARGET_ID" --arg status "$status" --arg reason "$reason" --arg lockfiles "$LOCKFILES" \
            '{id: $id, status: $status, reason: (if $reason == "" then null else $reason end), lockfiles: (if $lockfiles == "" then null else ($lockfiles | tonumber) end)}' \
            > "$out/$TARGET_ID.status.json"
          cat "$out/$TARGET_ID.status.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-part-trivy-${{ matrix.target.id }}
          path: ${{ runner.temp }}/sca-out/
          retention-days: 1
          if-no-files-found: error

  # ORT (analyzer + advisor with OSV) scans the source code next to Trivy. It runs in its own job and its failure
  # is a failed target like Trivy's, but its findings are not merged into the records yet (see sca_merge_results)
  ort:
    needs: targets
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.targets.outputs.ort-matrix != '[]' }}
    name: ORT ${{ matrix.target.id }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.ort-matrix) }}
    env:
      TARGET_ID: ${{ matrix.target.id }}
    steps:
      - name: Prepare output directory
        run: mkdir -p "$RUNNER_TEMP/sca-out/ort"
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # The commit the targets job resolved for this target, not a moving branch
          ref: ${{ matrix.target.commit_sha }}
          persist-credentials: false
          lfs: true
      - name: Detect Gradle build
        id: stack
        run: |
          if [ -f gradlew ] && { [ -f build.gradle ] || [ -f build.gradle.kts ]; }; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Java
        id: java
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: epam/ai-dial-ci/actions/java_prepare@4.12.0
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
      # The ORT image has JDK 25 only, which Gradle 8.x cannot run on, and `javaVersion` would download a JDK from
      # foojay, an extra service to depend on. So the JDK set up above is mounted into the container and used as
      # the Gradle JDK (`javaHome`); a `customJdkUrl` of the repository `.ort.yml` still takes precedence over it
      - name: Configure ORT for Gradle
        id: gradle
        if: ${{ steps.stack.outputs.java == 'true' }}
        env:
          JDK_MOUNT: /opt/jdk-host
        run: |
          echo "docker-cli-args=-v $JAVA_HOME:$JDK_MOUNT:ro" >> "$GITHUB_OUTPUT"
          echo "ort-cli-args=-P ort.analyzer.packageManagers.GradleInspector.options.javaHome=$JDK_MOUNT" >> "$GITHUB_OUTPUT"
      # ORT chooses the package managers itself (its defaults), so there is no per-stack setup here. It sets no HTTP
      # timeouts, so a hung request would block the job for 6 hours; the step timeout stops it earlier and lets the
      # status step below report the target as failed
      - name: Run ORT
        id: ort
        timeout-minutes: 60
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          image: "ghcr.io/oss-review-toolkit/ort-minimal:${{ inputs.ort-version }}"
          run: "analyzer, advisor"
          advisors: OSV
          allow-dynamic-versions: "true"
          # Percentage of the runner memory instead of a fixed size, which depends on the runner and on the
          # repository visibility
          ort-jdk-java-options: "-XX:MaxRAMPercentage=75.0"
          ort-cli-args: >-
            -P ort.forceOverwrite=true
            --stacktrace
            ${{ steps.gradle.outputs.ort-cli-args }}
          docker-cli-args: >-
            -e GPR_USERNAME=${{ github.actor }}
            -e GPR_PASSWORD=${{ secrets.GITHUB_TOKEN }}
            ${{ steps.gradle.outputs.docker-cli-args }}
          ort-config-repository: ${{ inputs.ort-config-repository }}
          ort-config-revision: ${{ inputs.ort-config-revision }}
      # The action swallows the ORT exit code 2 (issues) and its `fail-on` does not work for the advisor, so the
      # verdict is made here from the result. The status is written even if ORT failed: a failed target must not
      # look like a clean one
      - name: Write scan status
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          ORT_OUTCOME: ${{ steps.ort.outcome }}
        run: |
          out="$RUNNER_TEMP/sca-out/ort"
          result="$HOME/.ort/ort-results/advisor-result.json"
          status=ok
          reason=
          for step in "checkout:$CHECKOUT_OUTCOME" "java setup:$JAVA_OUTCOME" "gradle configuration:$GRADLE_OUTCOME" "ort run:$ORT_OUTCOME"; do
            outcome="${step#*:}"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              status=failed
              reason="${step%%:*} $outcome"
              break
            fi
          done
          analyzer_errors=0
          advisor_errors=0
          # Error issues: anywhere under `analyzer` (as the gates' "Fail on ORT Analyzer errors"), and the provider
          # issues and per-package advisor issues. Since ORT 93 a failed OSV request ends up in the latter
          analyzer_issues='[.analyzer | .. | objects | select(has("severity") and has("message")) | select(.severity == "ERROR")]'
          advisor_issues='[(.advisor.provider_issues // [])[], ((.advisor.results // {}) | .[][] | (.summary.issues // [])[]) | select(.severity == "ERROR")]'
          describe='.[:20][] | "[\(.severity)] \(.source // "unknown"): \(.message)"'
          if [ -f "$result" ] && jq -e . "$result" > /dev/null 2>&1; then
            # Kept even for a failed target, for audit
            cp "$result" "$out/$TARGET_ID.json"
            analyzer_errors="$(jq "$analyzer_issues | length" "$result")"
            advisor_errors="$(jq "$advisor_issues | length" "$result")"
            echo "Analyzer ERROR issues: $analyzer_errors, advisor ERROR issues: $advisor_errors"
            if [ "$analyzer_errors" -gt 0 ] || [ "$advisor_errors" -gt 0 ]; then
              jq -r "$analyzer_issues | $describe" "$result"
              jq -r "$advisor_issues | $describe" "$result"
              if [ "$status" = "ok" ]; then
                status=failed
                reason="ort reported $analyzer_errors analyzer and $advisor_errors advisor error issue(s)"
              fi
            fi
          elif [ "$status" = "ok" ]; then
            status=failed
            reason="advisor result is missing or is not valid JSON"
          fi
          jq -n --arg id "$TARGET_ID" --arg status "$status" --arg reason "$reason" --argjson analyzer_errors "$analyzer_errors" --argjson advisor_errors "$advisor_errors" \
            '{id: $id, status: $status, reason: (if $reason == "" then null else $reason end), analyzer_errors: $analyzer_errors, advisor_errors: $advisor_errors}' \
            > "$out/$TARGET_ID.status.json"
          cat "$out/$TARGET_ID.status.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-part-ort-${{ matrix.target.id }}
          path: ${{ runner.temp }}/sca-out/
          retention-days: 1
          if-no-files-found: error

  report:
    needs: [targets, trivy-db, trivy, ort]
    # Without the targets result there is nothing to report on; the run is red anyway because the targets job failed
    if: ${{ always() && needs.targets.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      # The targets part is always there, so the download does not fail when no target was scanned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sca-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/sca-parts
      - uses: vitado/ai-dial-ci/actions/sca_merge_results@pilot/sca-ort-probe
        id: merge
        with:
          targets-file: ${{ runner.temp }}/sca-parts/targets.json
          parts-dir: ${{ runner.temp }}/sca-parts
          output-dir: ${{ runner.temp }}/sca
          trivy-db-info: ${{ needs.trivy-db.outputs.db-info }}
          ort-config-repository: ${{ inputs.ort-config-repository }}
          ort-config-revision: ${{ inputs.ort-config-revision }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-report
          path: ${{ runner.temp }}/sca/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      # After the upload, so that the report is available even if some targets failed
      - name: Fail on failed targets
        if: ${{ steps.merge.outputs.failed-count != '0' }}
        env:
          FAILED_COUNT: ${{ steps.merge.outputs.failed-count }}
        run: |
          # Per-target errors are annotated by the merge step; this one only fails the run
          echo "::error::$FAILED_COUNT target(s) failed to be scanned, see the job summary or _report/scan_report.json"
          exit 1

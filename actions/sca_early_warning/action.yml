name: Early warning for SCA scan packages
description: Match the CVE records of the central CVE index (and the cvelistV5 deltas since it was built) with the language packages found by Trivy in an SCA scheduled scan, for CVEs that vulnerability databases do not map to packages yet. Informational, never a finding

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the Trivy scan parts (trivy/<id>.json and trivy/<id>.status.json of every Trivy target)
    required: true
  output-dir:
    description: Directory to write the early warning part into (early-warning/status.json and early-warning/candidates.json)
    required: true
  cve-index:
    description: The CVE index artifact (built by the sca_cve_index.yml workflow) to pull anonymously with ORAS, for example ghcr.io/epam/ai-dial-sca-cve-index:1. Its window of days is the window of the early warning
    required: true

outputs:
  status:
    description: ok, failed or skipped. A failure is reported, but is not a failure of the scan
    value: ${{ steps.match.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Set up ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: "1.3.4"
    - name: Match CVE records with packages
      id: match
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        CVE_INDEX: ${{ inputs.cve-index }}
      run: >-
        python "$ACTION_PATH/early_warning.py"
        --targets-file "$TARGETS_FILE"
        --parts-dir "$PARTS_DIR"
        --output-dir "$OUTPUT_DIR"
        --cve-index "$CVE_INDEX"

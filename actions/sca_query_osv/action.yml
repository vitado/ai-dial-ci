name: Query OSV for SCA scan packages
description: Check the language packages found by Trivy in the targets of an SCA scheduled scan against OSV (osv.dev); OS packages are not queried

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the Trivy scan parts (trivy/<id>.json and trivy/<id>.status.json of every Trivy target)
    required: true
  output-dir:
    description: Directory to write the OSV parts into (osv/<id>.json and osv/<id>.status.json of every OSV target)
    required: true
  api-url:
    description: Base URL of the OSV API
    default: https://api.osv.dev

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Query OSV
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        API_URL: ${{ inputs.api-url }}
      run: >-
        python "$ACTION_PATH/query_osv.py"
        --targets-file "$TARGETS_FILE"
        --parts-dir "$PARTS_DIR"
        --output-dir "$OUTPUT_DIR"
        --api-url "$API_URL"

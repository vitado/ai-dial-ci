name: Merge SCA scan results
description: Merge the per-target results of an SCA scheduled scan into a deduplicated report (decision-first summary, JSON)

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the per-scanner scan parts (<scanner>/<id>.json, <scanner>/<id>.status.json, optional <scanner>/<id>.txt, optional trivy/<id>.gradle-graph/ with the Gradle dependency graph of a source target; trivy and osv)
    required: true
  output-dir:
    description: Directory to write the report into (summary.md, _report/, _native/<scanner>/)
    required: true
  trivy-db-info:
    description: 'JSON object {"vulnerability_db_updated_at": ..., "java_db_updated_at": ...} describing the Trivy DB snapshot of the run; empty means unknown'
    default: ""
  early-warning-enabled:
    description: Whether the run has an early warning part (early-warning/ in parts-dir) to report; false leaves the report as it was without one
    default: "false"
  baseline-dir:
    description: Directory with the sca-report artifact of the baseline run (the latest full run), to say what changed since it; empty means there is no baseline
    default: ""
  baseline-reason:
    description: Why there is no baseline, if the step that looked for it knows; shown in the report
    default: ""
  step-summary:
    description: Whether to append summary.md to the job summary
    default: "true"

outputs:
  failed-count:
    description: Number of targets whose scan failed (the workflow decides whether to fail the run)
    value: ${{ steps.merge.outputs.failed-count }}
  report-dir:
    description: Directory with the generated report
    value: ${{ steps.merge.outputs.report-dir }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Merge scan results
      id: merge
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
        TRIVY_DB_INFO: ${{ inputs.trivy-db-info }}
        EARLY_WARNING_ENABLED: ${{ inputs.early-warning-enabled }}
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        BASELINE_REASON: ${{ inputs.baseline-reason }}
      run: |
        args=(
          --targets-file "$TARGETS_FILE"
          --parts-dir "$PARTS_DIR"
          --output-dir "$OUTPUT_DIR"
          --step-summary "$STEP_SUMMARY"
          --trivy-db-info "$TRIVY_DB_INFO"
          --early-warning-enabled "$EARLY_WARNING_ENABLED"
          --baseline-reason "$BASELINE_REASON"
        )
        if [ -n "$BASELINE_DIR" ]; then
          args+=(--baseline-dir "$BASELINE_DIR")
        fi
        python "$ACTION_PATH/merge_results.py" "${args[@]}"

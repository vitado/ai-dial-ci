name: SCA actions tests

on:
  pull_request:
    paths:
      - "actions/sca_*/**"
      - "test/sca/**"
      - ".github/workflows/sca-actions-test.yml"
  push:
    branches: [main]
    paths:
      - "actions/sca_*/**"
      - "test/sca/**"
      - ".github/workflows/sca-actions-test.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      # PyYAML as the actions install it: pinned, with hashes
      - name: Install action dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r actions/sca_resolve_targets/requirements.txt
      - name: Run tests
        run: python -m pytest test/sca

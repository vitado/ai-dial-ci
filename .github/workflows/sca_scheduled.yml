name: SCA scheduled scan

on:
  workflow_call:
    inputs:
      images:
        type: string
        description: Image names without registry, one per line (e.g. epam/ai-dial-chat). Empty means source scan only
        default: ""
      registry:
        type: string
        description: Container registry the images are pulled from
        default: "ghcr.io"
      repository:
        type: string
        description: Repository (owner/name) whose code is scanned and whose releases are resolved. Defaults to the calling repository
        default: ""
      release-lines:
        type: number
        description: Number of latest stable release lines to scan
        default: 1
      java-version:
        type: string
        description: Java version to use to generate lockfiles (Gradle repositories only)
        default: "21"
      java-distribution:
        type: string
        description: Java distribution to use
        default: "temurin"
      trivy-version:
        type: string
        description: Trivy version to use (release tag, e.g. v0.75.0)
        default: "v0.75.0"
      trivy-db-repository:
        type: string
        description: Trivy vulnerability DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
      trivy-java-db-repository:
        type: string
        description: Trivy Java DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"
      osv-enabled:
        type: boolean
        description: Also check the language packages found by Trivy against OSV (osv.dev). Its findings are merged into the report
        default: true
      early-warning-enabled:
        type: boolean
        description: Also look for CVE records that match the language packages found by Trivy but that no vulnerability database maps to packages yet. An informational section of the report, not findings; a failure of this check does not fail the run
        default: true
      early-warning-days:
        type: number
        description: The early warning considers CVE records published or updated in this many days
        default: 90
      retention-days:
        type: number
        description: Retention period (days) of the resulting `sca-report` artifact
        default: 90
      targets:
        type: string
        description: "Scan only the targets whose id matches one of these patterns (comma- or newline-separated, `*` and `?` work: `source-*`, `ai-dial-chat-1.1.14`). A pattern that matches no target is an error. Empty means all. A filtered run is a partial one: it is compared with the last full run, but never is the baseline of a later run"
        default: ""
      scan-source:
        type: boolean
        description: Scan the source code (default branch)
        default: true
      scan-images:
        type: boolean
        description: Scan the container images
        default: true
      scan-release-source:
        type: boolean
        description: Scan the source code of the latest releases (git tags), too; needs scan-source. Gives release findings their dependency paths and covers repositories without images
        default: true
      config:
        type: string
        description: "SCA configuration (YAML, the schema of .github/sca.yml) that is used instead of the .github/sca.yml of the scanned repository, for repositories that cannot carry the file. Empty means the file, if there is one, else the defaults"
        default: ""
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-24.04"]'

jobs:
  targets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      trivy-skip-paths: ${{ steps.targets.outputs.trivy-skip-paths }}
    steps:
      - uses: epam/ai-dial-ci/actions/sca_resolve_targets@4.12.0
        id: targets
        with:
          repository: ${{ inputs.repository || github.repository }}
          registry: ${{ inputs.registry }}
          images: ${{ inputs.images }}
          release-lines: ${{ inputs.release-lines }}
          scan-source: ${{ inputs.scan-source }}
          scan-images: ${{ inputs.scan-images }}
          scan-release-source: ${{ inputs.scan-release-source }}
          osv-enabled: ${{ inputs.osv-enabled }}
          early-warning-enabled: ${{ inputs.early-warning-enabled }}
          targets: ${{ inputs.targets }}
          config: ${{ inputs.config }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-part-targets
          path: ${{ steps.targets.outputs.targets-file }}
          retention-days: 1
          if-no-files-found: error

  # One Trivy DB snapshot per run: all targets scan against the same DB versions, and the matrix jobs neither
  # download the DB each nor race to save the same cache keys (this job is the single cache writer)
  trivy-db:
    if: ${{ inputs.scan-source || inputs.scan-images }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
      db-info: ${{ steps.info.outputs.db-info }}
    steps:
      # First, so that the key is published even if a later step fails
      - name: Define DB cache key
        id: key
        run: echo "cache-key=trivy-db-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ inputs.trivy-version }}
          cache: true # the binary is cached under a version key; this is the only job that saves it
      - name: Download Trivy databases
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DB_REPOSITORY: ${{ inputs.trivy-db-repository }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ inputs.trivy-java-db-repository }}
        run: |
          trivy image --download-db-only
          trivy image --download-java-db-only
      - name: Describe Trivy databases
        id: info
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy version --format json > "$RUNNER_TEMP/trivy-version.json"
          jq . "$RUNNER_TEMP/trivy-version.json"
          db_info="$(jq -c '{vulnerability_db_updated_at: .VulnerabilityDB.UpdatedAt, java_db_updated_at: .JavaDB.UpdatedAt}' "$RUNNER_TEMP/trivy-version.json")"
          echo "db-info=$db_info" >> "$GITHUB_OUTPUT"
          echo "Trivy DB snapshot: $db_info" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.key.outputs.cache-key }}

  trivy:
    needs: [targets, trivy-db]
    # Runs even if trivy-db failed: the DB restore then fails and every target is reported as failed with a reason
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.targets.outputs.matrix != '[]' }}
    name: Trivy ${{ matrix.target.id }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      # Scan profile: exposure of the repository, not a gate, so nothing is ignored or filtered out.
      # It is set via env rather than trivy-action inputs: the action exports an input to TRIVY_* only when it
      # differs from the action's own default, so `ignore-unfixed: false` or the full severity list would not be
      # exported and a repository's trivy.yaml would win. Environment variables take precedence over trivy.yaml.
      # TRIVY_IGNOREFILE is /dev/null, not empty, because trivy treats an empty value as unset and reads .trivyignore
      TRIVY_IGNOREFILE: /dev/null
      TRIVY_IGNORE_UNFIXED: "false"
      TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      TRIVY_PKG_TYPES: os,library
      TRIVY_SCANNERS: vuln
      TRIVY_LIST_ALL_PKGS: "true" # trivy default for JSON, pinned so a repository trivy.yaml cannot disable the inventory behind packages_scanned
      TRIVY_INCLUDE_DEV_DEPS: "true" # trivy skips dev dependencies by default; trivy-action has no input for it
      TRIVY_EXIT_CODE: "0" # findings are the payload, not a failure
      TRIVY_DISABLE_VEX_NOTICE: "true"
      # All targets of the run use the snapshot restored from the trivy-db job
      TRIVY_SKIP_DB_UPDATE: "true"
      TRIVY_SKIP_JAVA_DB_UPDATE: "true"
      TARGET_ID: ${{ matrix.target.id }}
    steps:
      - name: Prepare output directory
        run: mkdir -p "$RUNNER_TEMP/sca-out/trivy"
      # The DB snapshot of the trivy-db job; a miss fails the target instead of silently downloading another DB
      - name: Restore Trivy databases
        id: db
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ needs.trivy-db.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        id: setup
        with:
          version: ${{ inputs.trivy-version }}
          cache: true # hits the binary cache saved by trivy-db, so there is no save race between the matrix jobs
      - name: Checkout
        id: checkout
        if: ${{ matrix.target.kind == 'fs' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # The commit the targets job resolved for this target, not a moving branch
          ref: ${{ matrix.target.commit_sha }}
          persist-credentials: false
          lfs: true
      # The skip-dirs / skip-files of the trivy.yaml of this very commit: what the SCA configuration (trivy_skip_paths)
      # makes of them is decided here; the merge reads the record. The generated config replaces trivy.yaml only when
      # Trivy must not skip the paths (a plain environment variable cannot clear a list the file sets)
      - name: Prepare Trivy configuration
        id: trivy-config
        if: ${{ matrix.target.kind == 'fs' }}
        uses: epam/ai-dial-ci/actions/sca_prepare_trivy_config@4.12.0
        with:
          mode: ${{ needs.targets.outputs.trivy-skip-paths }}
          target-id: ${{ matrix.target.id }}
          output-dir: ${{ runner.temp }}/sca-out/trivy
      - name: Detect Gradle build
        id: stack
        if: ${{ matrix.target.kind == 'fs' }}
        run: |
          if [ -f gradlew ] && { [ -f build.gradle ] || [ -f build.gradle.kts ]; }; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Java
        id: java
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: epam/ai-dial-ci/actions/java_prepare@4.12.0
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
      - name: Generate Gradle lockfiles
        id: lockfiles
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: epam/ai-dial-ci/actions/generate_gradle_lockfiles@4.12.0
        with:
          gpr-username: ${{ github.actor }}
          gpr-password: ${{ secrets.GITHUB_TOKEN }}
          # Lockfiles have no dependency graph: it travels in the part of the target for the merge, outside the workspace
          graph-dir: ${{ runner.temp }}/sca-out/trivy/${{ matrix.target.id }}.gradle-graph
      # Images in other registries are expected to be public and are pulled anonymously
      - name: Login to GitHub Container Registry
        id: login
        if: ${{ matrix.target.kind == 'image' && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ matrix.target.kind }}
          scan-ref: .
          image-ref: ${{ matrix.target.ref }}
          # Empty (trivy.yaml of the repository, if any, applies as is) unless the skip paths must be scanned
          trivy-config: ${{ steps.trivy-config.outputs.config-file }}
          format: json
          output: ${{ runner.temp }}/sca-out/trivy/${{ matrix.target.id }}.json
          # Outside the workspace, so that the cache is not scanned
          cache-dir: ${{ runner.temp }}/trivy-cache
          # Trivy and the DB are set up above; trivy-action must not set up or cache anything itself
          skip-setup-trivy: true
          cache: false
      - name: Generate Trivy report (Table)
        if: ${{ steps.trivy.outcome == 'success' }}
        run: |
          trivy convert --format table --output "$RUNNER_TEMP/sca-out/trivy/$TARGET_ID.txt" "$RUNNER_TEMP/sca-out/trivy/$TARGET_ID.json"
      # The status is written even if the scan failed: a failed target must not look like a clean one
      - name: Write scan status
        if: ${{ always() }}
        env:
          DB_OUTCOME: ${{ steps.db.outcome }}
          DB_JOB_RESULT: ${{ needs.trivy-db.result }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TRIVY_CONFIG_OUTCOME: ${{ steps.trivy-config.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          LOCKFILES_OUTCOME: ${{ steps.lockfiles.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          LOCKFILES: ${{ steps.lockfiles.outputs.lockfiles }}
        run: |
          out="$RUNNER_TEMP/sca-out/trivy"
          status=ok
          reason=
          for step in "trivy db restore:$DB_OUTCOME" "trivy setup:$SETUP_OUTCOME" "checkout:$CHECKOUT_OUTCOME" "trivy configuration:$TRIVY_CONFIG_OUTCOME" "java setup:$JAVA_OUTCOME" "lockfile generation:$LOCKFILES_OUTCOME" "registry login:$LOGIN_OUTCOME" "trivy scan:$TRIVY_OUTCOME"; do
            outcome="${step#*:}"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              status=failed
              reason="${step%%:*} $outcome"
              if [ "${step%%:*}" = "trivy db restore" ]; then
                reason="$reason (trivy-db job: $DB_JOB_RESULT)"
              fi
              break
            fi
          done
          if [ "$status" = "ok" ] && [ "$TRIVY_OUTCOME" != "success" ]; then
            status=failed
            reason="scan did not complete"
          fi
          if [ "$status" = "ok" ] && ! jq -e . "$out/$TARGET_ID.json" > /dev/null 2>&1; then
            status=failed
            reason="trivy output is missing or is not valid JSON"
          fi
          jq -n --arg id "$TARGET_ID" --arg status "$status" --arg reason "$reason" --arg lockfiles "$LOCKFILES" \
            '{id: $id, status: $status, reason: (if $reason == "" then null else $reason end), lockfiles: (if $lockfiles == "" then null else ($lockfiles | tonumber) end)}' \
            > "$out/$TARGET_ID.status.json"
          cat "$out/$TARGET_ID.status.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-part-trivy-${{ matrix.target.id }}
          path: ${{ runner.temp }}/sca-out/
          retention-days: 1
          if-no-files-found: error

  # OSV is asked about the language packages Trivy found (OS packages are not queried), so it runs after the Trivy
  # matrix. A broken query is a failed target like a failed Trivy scan; its findings are merged into the records by
  # sca_merge_results. Nothing to query, and so no job, if no Trivy target was scanned
  osv:
    needs: [targets, trivy]
    if: ${{ !cancelled() && needs.targets.result == 'success' && inputs.osv-enabled && needs.targets.outputs.matrix != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    # Normally a few requests per 1000 packages and one per distinct vulnerability, i.e. a few minutes. A request is
    # bounded by 4 attempts of 30 s each plus backoff, so the job bound only stops an API that is up but crawling
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sca-part-targets
          path: ${{ runner.temp }}/sca-parts
      # Trivy ran (the matrix is not empty), so at least one part is there; a failed Trivy target has its status part
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sca-part-trivy-*
          merge-multiple: true
          path: ${{ runner.temp }}/sca-parts
      - uses: epam/ai-dial-ci/actions/sca_query_osv@4.12.0
        with:
          targets-file: ${{ runner.temp }}/sca-parts/targets.json
          parts-dir: ${{ runner.temp }}/sca-parts
          output-dir: ${{ runner.temp }}/sca-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-part-osv
          path: ${{ runner.temp }}/sca-out/
          retention-days: 1
          if-no-files-found: error

  # The early warning matches the CNA data of recent CVE records with the language packages Trivy found, for CVEs that no
  # scanner of the run reports because no database maps them to a package yet. One job per run, after the Trivy matrix.
  # A heuristic signal: a feed or deps.dev failure is reported as "unavailable" in the report and does not fail the job
  early-warning:
    needs: [targets, trivy]
    if: ${{ !cancelled() && needs.targets.result == 'success' && inputs.early-warning-enabled && needs.targets.outputs.matrix != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    # About 90 daily deltas of a few MB and one deps.dev request per package name (4 at a time); every request is bounded
    # by 4 attempts of 60 s each plus backoff, so the job bound only stops a service that is up but crawling
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sca-part-targets
          path: ${{ runner.temp }}/sca-parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sca-part-trivy-*
          merge-multiple: true
          path: ${{ runner.temp }}/sca-parts
      - uses: epam/ai-dial-ci/actions/sca_early_warning@4.12.0
        with:
          targets-file: ${{ runner.temp }}/sca-parts/targets.json
          parts-dir: ${{ runner.temp }}/sca-parts
          output-dir: ${{ runner.temp }}/sca-out
          window-days: ${{ inputs.early-warning-days }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-part-early-warning
          path: ${{ runner.temp }}/sca-out/
          retention-days: 1
          if-no-files-found: error

  report:
    needs: [targets, trivy-db, trivy, osv, early-warning]
    # Without the targets result there is nothing to report on; the run is red anyway because the targets job failed
    if: ${{ always() && needs.targets.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      # to read the runs and the report artifact of the baseline of the diff
      actions: read
    steps:
      # The targets part is always there, so the download does not fail when no target was scanned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sca-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/sca-parts
      # What changed since the last full run of this workflow on the default branch. Having no baseline
      # (the first run, an expired report, a failed lookup) is not an error: the report says so
      - uses: epam/ai-dial-ci/actions/sca_find_baseline@4.12.0
        id: baseline
      - name: Download the baseline report
        id: baseline-report
        if: ${{ steps.baseline.outputs.run-id != '' }}
        # The report does not depend on it: a baseline that cannot be downloaded is reported as missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sca-report
          run-id: ${{ steps.baseline.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sca-baseline
      - uses: epam/ai-dial-ci/actions/sca_merge_results@4.12.0
        id: merge
        with:
          targets-file: ${{ runner.temp }}/sca-parts/targets.json
          parts-dir: ${{ runner.temp }}/sca-parts
          output-dir: ${{ runner.temp }}/sca
          trivy-db-info: ${{ needs.trivy-db.outputs.db-info }}
          early-warning-enabled: ${{ inputs.early-warning-enabled }}
          baseline-dir: ${{ steps.baseline-report.outcome == 'success' && format('{0}/sca-baseline', runner.temp) || '' }}
          baseline-reason: ${{ steps.baseline.outputs.run-id != '' && steps.baseline-report.outcome != 'success' && format('the report of baseline run {0} could not be downloaded', steps.baseline.outputs.run-id) || steps.baseline.outputs.reason }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sca-report
          path: ${{ runner.temp }}/sca/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      # After the upload, so that the report is available even if some targets failed
      - name: Fail on failed targets
        if: ${{ steps.merge.outputs.failed-count != '0' }}
        env:
          FAILED_COUNT: ${{ steps.merge.outputs.failed-count }}
        run: |
          # Per-target errors are annotated by the merge step; this one only fails the run
          echo "::error::$FAILED_COUNT target(s) failed to be scanned, see the job summary or _report/scan_report.json"
          exit 1

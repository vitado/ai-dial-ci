name: Prepare Trivy configuration for an SCA source scan
description: Read the skip-dirs and skip-files of the trivy.yaml of the checked-out repository and, if the SCA configuration says they must not hide anything, write a copy of trivy.yaml without them for Trivy to use

inputs:
  mode:
    description: How the skip-dirs and skip-files are treated, trivy_skip_paths of the SCA configuration (as_non_shipped, apply or ignore)
    default: as_non_shipped
  target-id:
    description: Id of the scan target
    required: true
  output-dir:
    description: Directory for <target-id>.trivy-config.json (the Trivy parts directory of the target)
    required: true
  generated-dir:
    description: Directory for the generated Trivy config file (outside the scanned workspace)
    default: ${{ runner.temp }}/sca-trivy-config
  config-path:
    description: Trivy config file of the repository, relative to the working directory
    default: trivy.yaml

outputs:
  config-file:
    description: Config file Trivy has to use (trivy-config input of trivy-action); empty if Trivy keeps using its own trivy.yaml, if any
    value: ${{ steps.prepare.outputs.config-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    # PyYAML; pinned with hashes, wheels only (nothing is built or executed on install)
    - name: Install dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: >-
        python -m pip install --disable-pip-version-check --no-input
        --require-hashes --only-binary=:all:
        --requirement "$ACTION_PATH/requirements.txt"
    - name: Prepare Trivy configuration
      id: prepare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # the shared code of the SCA actions: actions/_sca_lib, a sibling of this directory
        PYTHONPATH: ${{ github.action_path }}/..
        MODE: ${{ inputs.mode }}
        TARGET_ID: ${{ inputs.target-id }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GENERATED_DIR: ${{ inputs.generated-dir }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: >-
        python "$ACTION_PATH/prepare_trivy_config.py"
        --mode "$MODE"
        --target-id "$TARGET_ID"
        --output-dir "$OUTPUT_DIR"
        --generated-dir "$GENERATED_DIR"
        --config-path "$CONFIG_PATH"

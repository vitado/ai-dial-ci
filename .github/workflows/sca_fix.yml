name: SCA fix

# Plans the dependency fixes of the newest release lines from SCA reports and delivers them as one pull request per
# release line: Dependabot jobs applied to the branch, a rescan as the gate, a base image bump for the OS findings.
# The two actions and the engine come from one release of epam/ai-dial-sec-sca (SCA_ENGINE_VERSION).
#
# Caller template (a run per repository at a time, a running run is never cancelled; `statuses: read` is needed by the
# baseline CI check of the apply job):
#
#   concurrency:
#     group: sca-fix
#     cancel-in-progress: false
#   jobs:
#     fix:
#       permissions: {contents: write, pull-requests: write, actions: read, statuses: read, packages: read}
#       uses: <owner>/ai-dial-ci/.github/workflows/sca_fix.yml@<ref>
#       with: {report-run-ids: ..., app-client-id: ...}
#       secrets: {app-private-key: ...}

# One fix run per repository at a time even for callers without their own group; a running run is not cancelled
concurrency:
  group: sca-fix-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      report-run-ids:
        type: string
        description: Comma-separated ids of runs in the calling repository whose `sca-report` artifact feeds the planner, the first run wins when two give the same release line
        required: true
      config:
        type: string
        description: Planner configuration, a JSON object (severities, severities-previous, fixable-only, include-dev, release-branch, release-lines, include-candidate, methods, allow-major)
        default: "{}"
      java-version:
        type: string
        description: Java version to use to generate lockfiles (Gradle repositories only)
        default: "21"
      java-distribution:
        type: string
        description: Java distribution to use
        default: "temurin"
      trivy-version:
        type: string
        description: Trivy version to use (release tag, e.g. v0.75.0)
        default: "v0.75.0"
      trivy-db-repository:
        type: string
        description: Trivy vulnerability DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
      trivy-java-db-repository:
        type: string
        description: Trivy Java DB repositories (comma-separated, tried in order)
        default: "mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"
      docker-build-args:
        type: string
        description: Docker build arguments of the image rescan, one NAME=value per line
        default: ""
      dependabot-timeout-minutes:
        type: number
        description: Time limit of one Dependabot job; a timeout counts as "Dependabot could not" and an npm item goes on to the override step
        default: 8
      dry-run:
        type: boolean
        description: Plan, apply and rescan, but do not push and do not open pull requests
        default: false
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-24.04"]'
      app-client-id:
        type: string
        description: Client ID of the GitHub App; with the secret app-private-key the push and the pull request use an app installation token
        default: ""
    secrets:
      token:
        required: false
        description: Token for the push and the pull request when no GitHub App is given (a pull request opened with the default token does not start the repository's pull request workflows)
      app-private-key:
        required: false
        description: Private key of the GitHub App given in app-client-id

env:
  # Dependabot CLI release and the images it starts, pinned (looked up 2026-11-02). The updater of each package manager
  # and the proxy are named by digest, so a new Dependabot release cannot change the behavior of a run
  DEPENDABOT_CLI_VERSION: v1.95.0
  DEPENDABOT_CLI_SHA256: fb8e2bf2fd78383bf465a7c271eb9cd5a232d2061a5c6bf4a4cfe87404172123
  DEPENDABOT_PROXY_IMAGE: ghcr.io/dependabot/proxy@sha256:77fc52df8cef2ac3d679a5f9305e92fafaad1fdc4b5a403857a2321386d103ea
  DEPENDABOT_UPDATER_IMAGES: >-
    {
    "npm_and_yarn": "ghcr.io/dependabot/dependabot-updater-npm@sha256:fe246822dc80652588c2cf8fe42ede6930604d217d4f01d82e160838b7afe50c",
    "pip": "ghcr.io/dependabot/dependabot-updater-pip@sha256:a1f36d592ed8b8961f2d2930615974ae2061b768f440ac8d26479162d805fc43",
    "gradle": "ghcr.io/dependabot/dependabot-updater-gradle@sha256:47eba85d4058934af6c237c99baf849de74fe4d790e0cbc30524d56b4b64b18e",
    "maven": "ghcr.io/dependabot/dependabot-updater-maven@sha256:30a6352dc8b8ac1457f3ae62e3306002b732cad0813a1c53af0acb5b59124387",
    "docker": "ghcr.io/dependabot/dependabot-updater-docker@sha256:9aab6978b65f6790f7fbc41cc1f2930c885e26741d69c8f9839e16c89c18e1a4"
    }
  SCA_ENGINE_VERSION: feat/k1-core

jobs:
  plan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      missing: ${{ steps.matrix.outputs.missing }}
    timeout-minutes: 15
    steps:
      - name: Download the reports
        id: reports
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          RUN_IDS: ${{ inputs.report-run-ids }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          : > "$RUNNER_TEMP/reports.txt"
          IFS=',' read -ra ids <<< "$RUN_IDS"
          for id in "${ids[@]}"; do
            id="${id// /}"
            [ -n "$id" ] || continue
            gh run download "$id" --repo "$REPO" --name sca-report --dir "$RUNNER_TEMP/reports/$id"
            echo "$RUNNER_TEMP/reports/$id/report.json" >> "$RUNNER_TEMP/reports.txt"
          done
          {
            echo "list<<EOF"
            cat "$RUNNER_TEMP/reports.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: epam/ai-dial-sec-sca/actions/sca_fix_plan@feat/k1-core
        with:
          reports: ${{ steps.reports.outputs.list }}
          config: ${{ inputs.config }}
          output-dir: ${{ runner.temp }}/fix-plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-plan
          path: ${{ runner.temp }}/fix-plan/
          retention-days: 30
          if-no-files-found: error
          overwrite: true # a re-run of the failed jobs uploads again
      # A line is applied when it has an automated item and its branch exists in the repository; the summary job lists the others
      - name: Lines to apply
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          matrix='[]'
          missing='[]'
          while IFS= read -r row; do
            branch="$(jq -r .branch <<< "$row")"
            if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/$branch" > /dev/null; then
              matrix="$(jq -c --argjson row "$row" '. + [$row]' <<< "$matrix")"
            else
              echo "::notice::Branch $branch does not exist in $REPO, its line is not applied"
              missing="$(jq -c --arg branch "$branch" '. + [$branch]' <<< "$missing")"
            fi
          done < <(jq -c '.lines[] | select(any(.items[]; .method != "manual")) | {line, branch, slug: (.branch | gsub("/"; "__"))}' "$RUNNER_TEMP/fix-plan/fix-plan.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    name: Apply ${{ matrix.line.branch }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      statuses: read
      packages: read
    # Per item a Dependabot job (up to dependabot-timeout-minutes) and a rescan, plus the image builds; the bound only stops a run that hangs
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TRIVY_DB_REPOSITORY: ${{ inputs.trivy-db-repository }}
      TRIVY_JAVA_DB_REPOSITORY: ${{ inputs.trivy-java-db-repository }}
      # Secrets are not available in `if:`, so the presence of the key is kept in an env flag
      APP_KEY_GIVEN: ${{ secrets.app-private-key != '' }}
    steps:
      # The app token is used for the push and the pull request: a pull request opened with it starts the repository's pull
      # request workflows and needs no repository setting. Without owner and repositories the token covers the current
      # repository only. The plan job keeps the other token: the artifact download needs `actions: read`, which the app lacks
      - name: Create the GitHub App token
        id: app-token
        if: ${{ inputs.app-client-id != '' && env.APP_KEY_GIVEN == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-plan
          path: ${{ runner.temp }}/fix-plan
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.line.branch }}
          token: ${{ steps.app-token.outputs.token || secrets.token || github.token }}
          persist-credentials: true # the push of the fix branch
          lfs: true # as the scan: Gradle wrapper jars of some repositories are LFS objects
      - name: Detect Gradle build
        id: stack
        run: |
          if [ -f gradlew ] && { [ -f build.gradle ] || [ -f build.gradle.kts ]; }; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Java
        if: ${{ steps.stack.outputs.java == 'true' }}
        uses: epam/ai-dial-ci/actions/java_prepare@4.12.0
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
      # The rescan of a Gradle build needs the lockfiles that the engine's scan generates: its init script is used as is
      - name: Get the Gradle lockfile script of the engine
        id: engine
        if: ${{ steps.stack.outputs.java == 'true' }}
        run: |
          git clone --quiet --depth 1 --branch "$SCA_ENGINE_VERSION" https://github.com/epam/ai-dial-sec-sca.git "$RUNNER_TEMP/sca-engine"
          {
            echo "lockfile-command<<EOF"
            echo "./gradlew --no-daemon --init-script \"$RUNNER_TEMP/sca-engine/actions/generate_gradle_lockfiles/lockfiles.init.gradle\" -Pai.dial.sca.graphDir=\"\$(mktemp -d)\" resolveAndLockAllConfigurations --write-locks"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ inputs.trivy-version }}
          cache: true
      # The same osv-scanner, pinned and checksum-checked in the same way, as the OSV step of the scheduled scan
      # (actions/sca_query_osv of the engine): the rescan asks OSV as the scan does
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
          SHA256_AMD64: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          SHA256_ARM64: 4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha256="$SHA256_AMD64" ;;
            aarch64 | arm64) arch=arm64; sha256="$SHA256_ARM64" ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --retry 3             --output "$RUNNER_TEMP/osv-scanner/osv-scanner"             "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_$arch"
          echo "$sha256  $RUNNER_TEMP/osv-scanner/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner/osv-scanner"
          echo "$RUNNER_TEMP/osv-scanner" >> "$GITHUB_PATH"
      # One database state for the baseline and every rescan of the line (the scheduled scan restores one snapshot per run)
      - name: Download the Trivy databases
        run: |
          trivy image --download-db-only
          trivy image --download-java-db-only
      - name: Install the Dependabot CLI
        run: |
          archive="dependabot-${DEPENDABOT_CLI_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/dependabot/cli/releases/download/${DEPENDABOT_CLI_VERSION}/$archive"
          echo "${DEPENDABOT_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/dependabot-cli"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/dependabot-cli"
      # The override step of npm items runs npm of the branch's node version (first of .nvmrc, .node-version, volta, engines,
      # Dockerfile); with no version found the items stay manual
      - name: Detect the node version
        id: node
        uses: epam/ai-dial-sec-sca/actions/sca_fix_apply@feat/k1-core
        with:
          command: node
          tree: ${{ github.workspace }}
      - name: Set up Node.js
        if: ${{ steps.node.outputs.version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Apply the plan of the line
        uses: epam/ai-dial-sec-sca/actions/sca_fix_apply@feat/k1-core
        env:
          GPR_USERNAME: ${{ github.actor }}
          GPR_PASSWORD: ${{ github.token }}
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          command: apply
          plan: ${{ runner.temp }}/fix-plan/fix-plan.json
          branch: ${{ matrix.line.branch }}
          tree: ${{ github.workspace }}
          output-dir: ${{ runner.temp }}/fix-result
          dependabot: ${{ runner.temp }}/dependabot-cli/dependabot
          updater-images: ${{ env.DEPENDABOT_UPDATER_IMAGES }}
          proxy-image: ${{ env.DEPENDABOT_PROXY_IMAGE }}
          lockfile-command: ${{ steps.engine.outputs.lockfile-command }}
          dependabot-timeout-minutes: ${{ inputs.dependabot-timeout-minutes }}
          docker-build-args: ${{ inputs.docker-build-args }}
          token: ${{ steps.app-token.outputs.token || secrets.token || github.token }}
          # the baseline CI needs actions and statuses read, which the app token does not have
          ci-token: ${{ github.token }}
      # The fixer identity: author and committer of the fix commit, and the owner of the commits on the fix branch
      - name: Resolve the fixer identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PERSONAL_TOKEN_GIVEN: ${{ secrets.token != '' }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            login="${APP_SLUG}[bot]"
            id=$(gh api "users/${login}" --jq .id)
          elif [ "$PERSONAL_TOKEN_GIVEN" = "true" ]; then
            login=$(gh api user --jq .login)
            id=$(gh api user --jq .id)
          else
            login="github-actions[bot]"
            id=41898282
          fi
          echo "name=$login" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Push the fix branch and open or update the pull request
        id: publish
        uses: epam/ai-dial-sec-sca/actions/sca_fix_apply@feat/k1-core
        with:
          command: publish
          plan: ${{ runner.temp }}/fix-plan/fix-plan.json
          branch: ${{ matrix.line.branch }}
          tree: ${{ github.workspace }}
          output-dir: ${{ runner.temp }}/fix-result
          dry-run: ${{ inputs.dry-run }}
          git-user-name: ${{ steps.identity.outputs.name }}
          git-user-email: ${{ steps.identity.outputs.email }}
          token-kind: ${{ steps.app-token.outcome == 'success' && 'app' || (secrets.token != '' && 'token' || 'workflow') }}
          token: ${{ steps.app-token.outputs.token || secrets.token || github.token }}
      # After the publish step, also when it failed: the result is what the summary job reads
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: fix-result-${{ matrix.line.slug }}
          path: ${{ runner.temp }}/fix-result/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true # a re-run of the failed jobs uploads again

  summary:
    needs: [plan, apply]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-plan
          path: ${{ runner.temp }}/fix-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fix-result-*
          path: ${{ runner.temp }}/fix-results
      - uses: epam/ai-dial-sec-sca/actions/sca_fix_apply@feat/k1-core
        with:
          command: summary
          plan: ${{ runner.temp }}/fix-plan/fix-plan.json
          results-dir: ${{ runner.temp }}/fix-results
          missing-branches: ${{ needs.plan.outputs.missing }}

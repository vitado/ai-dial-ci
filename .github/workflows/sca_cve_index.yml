name: SCA CVE index

# The daily index of the CVE records that the early warning of the SCA scheduled scan
# reads (see "CVE index for the early warning" in the README). It is an OCI artifact
# in the GitHub Container Registry. Two jobs: the one that builds the index runs
# code that downloads and parses outside data and may only read packages; the one
# that publishes it may write them and runs nothing but ORAS and the cleanup.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        type: boolean
        description: "Do not use the published index: build from the whole CVE list (the first run, recovery)"
        default: false

permissions:
  contents: read

concurrency:
  group: sca-cve-index
  cancel-in-progress: false

env:
  ORAS_VERSION: "1.3.3"
  ARTIFACT_TYPE: application/vnd.ai-dial.sca-cve-index.v1+json

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the previous index
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pilot only: the actions live on the pilot branch, not on the fork's main
          ref: pilot/sca-scheduled
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Name the artifact
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # registry names are lower case, owners are not
          echo "IMAGE=ghcr.io/${OWNER,,}/ai-dial-sca-cve-index" >> "$GITHUB_ENV"
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: oras login ghcr.io --username "$ACTOR" --password-stdin <<< "$TOKEN"
      - name: Pull the previous index
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEST: ${{ runner.temp }}/previous
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: ./actions/sca_build_cve_index/previous_index.sh
      - name: Build the index
        uses: ./actions/sca_build_cve_index
        with:
          output-dir: ${{ runner.temp }}/index
          previous-dir: ${{ steps.previous.outputs.dir }}
      # The index travels to the publishing job as an artifact: the job that parsed outside data has no right to write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-cve-index
          path: ${{ runner.temp }}/index
          retention-days: 1
          if-no-files-found: error
          overwrite: true # a re-run of the failed jobs uploads again

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # An index of about 30 MB: a push, and the cleanup of the old versions
    timeout-minutes: 15
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Name the artifact
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/ai-dial-sca-cve-index" >> "$GITHUB_ENV"
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: oras login ghcr.io --username "$ACTOR" --password-stdin <<< "$TOKEN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sca-cve-index
          path: ${{ runner.temp }}/index
      - name: Publish the index
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/index
        run: |
          built_at=$(jq -r .built_at metadata.json)
          day=${built_at%%T*}
          oras push "$IMAGE:1,1-$day" \
            --artifact-type "$ARTIFACT_TYPE" \
            --annotation "org.opencontainers.image.title=ai-dial-sca-cve-index" \
            --annotation "org.opencontainers.image.created=$built_at" \
            --annotation "org.opencontainers.image.source=$SOURCE" \
            --annotation "org.opencontainers.image.revision=$REVISION" \
            --format json \
            cves.jsonl.gz:application/gzip \
            metadata.json:application/json \
            > "$RUNNER_TEMP/push.json"
          digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
          {
            echo "### Published"
            echo
            echo "- \`$IMAGE@$digest\`"
            echo "- tags: \`1\`, \`1-$day\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete old versions
        # the tag 1 and the 30 latest dated versions stay (the tag 1 is on the latest)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ai-dial-sca-cve-index
          package-type: container
          min-versions-to-keep: 30
